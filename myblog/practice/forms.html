<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="forms.css" />
    <title>Forms</title>
  </head>
  <body>
    <h1>Forms</h1>
    <div class="form-container">
      <h2>Contact Form Example</h2>
      <p>This is information for the user.</p>
      <form action="">
        <div class="input-container">
          <label>Name:</label>
          <input
            type="text"
            placeholder="Enter username"
            id="txtName"
            name="user_name"
          />
        </div>
        <div class="input-container">
          <label>Age:</label>
          <input type="number" value="5" id="age" name="age" />
        </div>
        <div class="input-container">
          <label>Password:</label>
          <input type="password" name="user-pass" id="password" />
        </div>
        <div class="input-container">
          <label>E-mail:</label>
          <input
            type="email"
            name="email"
            placeholder="jane@doe.com"
            id="email"
          />
        </div>
        <div class="input-container">
          <label>Message: </label>
          <textarea></textarea>
        </div>
        <div class="input-container">
          <label>Phone Number:</label>
          <input
            type="tel"
            placeholder="555-555-5555"
            name="telephone"
            id="telephone"
          />
        </div>
        <div class="input-container">
          <label>Date: </label>
          <input type="date" name="date" id="date" />
        </div>

        <button>Send</button>
      </form>
    </div>
  </body>
</html>
